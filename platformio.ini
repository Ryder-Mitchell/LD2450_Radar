; Two builds from one project:
;   pio run -e serial -t upload   radar only, view it with viewer.py
;   pio run -e oled   -t upload   radar + OLED (also works with viewer.py)

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The S3-Zero has native USB only, so Serial goes over USB CDC.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; The S3-Zero has 4 MB flash; this partition table fits it (otherwise it boots-loops).
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:serial]
build_src_filter = -<*> +<serial/>

[env:oled]
build_src_filter = -<*> +<oled/>
lib_deps = olikraus/U8g2
